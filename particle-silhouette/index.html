<!DOCTYPE html>
<html lang="he">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Particle Silhouette – משחק תפיסה</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #FFFFFF;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }
    #stage {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #FFFFFF;
    }
    #canvas {
      max-width: 100vw;
      max-height: 100vh;
      background: #FFFFFF;
    }
    video { display: none; }
    #hud {
      position: fixed;
      top: 16px;
      left: 16px;
      color: #111;
      font-size: 16px;
      background: rgba(255,255,255,0.65);
      padding: 6px 14px;
      border-radius: 999px;
      z-index: 10;
      direction: rtl;
    }
    #hint {
      position: fixed;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      color: #333;
      font-size: 14px;
      background: rgba(255,255,255,0.65);
      padding: 6px 14px;
      border-radius: 999px;
      z-index: 10;
      direction: rtl;
      text-align: center;
      max-width: 90vw;
    }
  </style>
</head>
<body>
  <div id="stage">
    <video id="video" playsinline muted></video>
    <canvas id="canvas"></canvas>
  </div>

  <div id="hud">נתפסו: <span id="score">0</span></div>
  <div id="hint">תפסי את הבלוקים הצהובים עם היד – אם בלוק בורח מהמסך מגיעות המדוזות</div>

  <!-- TensorFlow.js + BodyPix (needed only for the live camera mode, not for ?demo) -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@2.4.0/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/body-pix@2.2.0/dist/body-pix.min.js"></script>
  <script src="main.js"></script>
</body>
</html>
